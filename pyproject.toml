[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m3u8-helper"
version = "0.2.0"
description = "Local Web and browser-extension helper for authorized M3U8 downloads."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.2",
]

[project.urls]
Homepage = "https://example.com"
Repository = "https://example.com"

[project.scripts]
m3u8-helper = "m3u8_helper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m3u8_helper = ["web_assets/*"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
